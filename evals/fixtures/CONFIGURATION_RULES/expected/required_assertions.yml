required_assertions:
  - id: sdk_version_needs_confirmation
    artifact: testability_gate.expected.json
    selector: items[source_rule_id=TECH-001]
    field: decision
    in: needs_confirmation
    reason: SDK目标版本未明确时不得生成正式业务验收
  - id: historical_metrics_out_of_scope
    artifact: testability_gate.expected.json
    selector: items[source_rule_id=TECH-006]
    field: testability
    in: out_of_scope
    reason: 活动复盘历史指标不进入本期正式业务验收
  - id: promo_size_soft_prompt_primary
    artifact: testability_gate.expected.json
    selector: items[source_rule_id=FR-盒子管理后台-编辑宣传内容-宣传内容编辑表单-02]
    field: classification
    in: soft_prompt
    reason: 宣传图片建议尺寸必须保持 soft_prompt
  - id: promo_size_soft_prompt_table
    artifact: testability_gate.expected.json
    selector: items[source_rule_id=FR-盒子管理后台-编辑宣传内容-宣传内容字段说明表-02]
    field: classification
    in: soft_prompt
    reason: 字段说明表中的建议尺寸同样不得升级为硬拦截
  - id: promo_size_partially_testable
    artifact: testability_gate.expected.json
    selector: items[source_rule_id=FR-盒子管理后台-编辑宣传内容-宣传内容编辑表单-02]
    field: testability
    in: partially_testable
    reason: 建议尺寸只验证提示展示
  - id: sdk_risk_note_only
    artifact: testability_gate.expected.json
    selector: items[source_rule_id=RISK-001]
    field: decision
    in: risk_note_only
    reason: 无验收阈值的SDK风险只进入风险说明
  - id: unknown_dialog_risk_note_only
    artifact: testability_gate.expected.json
    selector: items[source_rule_id=RISK-005]
    field: decision
    in: risk_note_only
    reason: 未展开弹窗不得脑补正式业务用例
  - id: promo_prompt_display
    artifact: case_plan.expected.json
    selector: case_plans[source_gate_ids~TG-033]
    field: case_type
    in: prompt_display
    reason: soft prompt 只能生成提示展示计划
  - id: promo_prompt_product_acceptance
    artifact: case_plan.expected.json
    selector: case_plans[source_gate_ids~TG-033]
    field: validation_path
    in: product_acceptance
    reason: 提示展示是页面验收，不是风险/API兜底
  - id: inventory_linkage
    artifact: case_plan.expected.json
    selector: case_plans[source_gate_ids~TG-015]
    field: case_type
    in: linkage
    reason: 库存阈值必须覆盖B端、服务端与C端联动
  - id: generated_fields_linkage
    artifact: case_plan.expected.json
    selector: case_plans[source_gate_ids~TG-027]
    field: case_type
    in: linkage
    reason: 配置及系统生成字段必须覆盖跨端一致性
  - id: promo_soft_display_acceptance
    artifact: acceptance_examples.expected.json
    selector: examples[source_gate_ids~TG-033]
    field: oracle_strength
    in: soft_display
    reason: 建议尺寸验收只能是 soft_display
  - id: promo_table_soft_display_acceptance
    artifact: acceptance_examples.expected.json
    selector: examples[source_gate_ids~TG-037]
    field: oracle_strength
    in: soft_display
    reason: 字段说明表中的提示仍只能是 soft_display
  - id: inventory_business_acceptance
    artifact: acceptance_examples.expected.json
    selector: examples[source_gate_ids~TG-015]
    field: oracle_strength
    in: business_behavior,linkage
    reason: 库存联动必须存在可观察业务验收
  - id: no_sdk_acceptance
    artifact: acceptance_examples.expected.json
    selector: examples[source_gate_ids~TG-041]
    absent: true
    reason: 未明确SDK目标版本不能生成 acceptance example
  - id: no_risk_acceptance
    artifact: acceptance_examples.expected.json
    selector: examples[source_gate_ids~TG-058]
    absent: true
    reason: risk_note_only 不得进入 acceptance example
  - id: no_risk_case_plan
    artifact: case_plan.expected.json
    selector: case_plans[source_gate_ids~TG-058]
    absent: true
    reason: risk_note_only 不得进入 product acceptance Case Plan
