version: 4
description: 测试用例统一标签规则（载体与责任拆分版）

principles:
  - 标签只承接风险标识、自动化执行载体、人工执行责任、人工评审投入
  - 页面、页面模块、终端信息不使用标签承接
  - 测试类型不使用标签承接，统一使用用例模板中的【测试类型】字段
  - 标签集合必须收口，不允许自由扩展同义标签
  - 每条用例的标签应尽量少而准，避免堆砌
  - AI-API用例 / AI-UI用例 表示适合沉淀的执行载体，测试必测 / 开发必测 表示人工执行责任

closed_tag_set:
  business_risk:
    - 核心链路
    - 黄金用例

  automation_carrier:
    - AI-API用例
    - AI-UI用例

  execution_responsibility:
    - 测试必测
    - 开发必测

  review_mode:
    - 评审用例

forbidden_as_tags:
  - 首页
  - 游戏官网
  - 页游顶栏
  - 登录弹窗
  - 注册弹窗
  - 选服弹窗
  - 顶部导航
  - banner
  - 用户信息区
  - 开服列表
  - 游戏列表
  - 游戏公告
  - 区服选择
  - 底栏
  - B端
  - C端
  - 后台
  - H5
  - 小程序
  - 接口
  - 服务端
  - 功能
  - 边界
  - 异常
  - 权限
  - 流程验证
  - 状态流转
  - 数据校验
  - 回归
  - 流程型用例
  - 单点用例
  - 跨模块
  - 发布必测
  - 数据正确性
  - 展示相关
  - 配置相关

mandatory_rules:
  - 每条用例至少命中 1 个 automation_carrier 或 execution_responsibility 标签
  - 非核心且可被 AI-API / AI-UI 稳定覆盖的用例，可以只保留载体标签，不强制追加测试必测或开发必测
  - 核心流程或关键变更用例必须同时包含开发必测与测试必测
  - business_risk 标签为按需使用，不强制每条都打
  - review_mode 标签为按需使用，不强制每条都打
  - 不允许输出 closed_tag_set 之外的新标签
  - 标签之间允许组合，不互斥

tag_definitions:
  核心链路:
    meaning: 直接影响主业务闭环是否成立的用例
    apply_when:
      - 涉及登录、进入游戏、发布、生效、审核、充值、核心状态流转等主路径
      - 失败会导致关键业务不可用
      - 属于主流程中的关键节点
    not_apply_when:
      - 仅为普通展示校验
      - 仅为低风险边界验证
      - 不影响主链路成立

  黄金用例:
    meaning: 上线前最小必跑集合中的关键用例
    apply_when:
      - 发布前必须执行
      - 可代表某个关键流程是否可用
      - 属于回归集中的高优先级核心样例
    not_apply_when:
      - 仅为补充性边界/异常验证
      - 不是发布决策的重要依据

  AI-API用例:
    meaning: 适合由 AI 驱动沉淀为接口 / 数据 / 服务端自动化的执行载体标签
    apply_when:
      - 主要验证接口、数据返回、状态流转、后端规则
      - 不依赖复杂 UI 操作
      - 适合通过请求、断言、数据校验完成
      - 同一验证点 API 与 UI 均可覆盖时，优先标记 AI-API用例
    not_apply_when:
      - 主要验证页面展示与前端交互
      - 必须依赖页面行为完成校验

  AI-UI用例:
    meaning: 适合由 AI 驱动沉淀为 UI 自动化的执行载体标签
    apply_when:
      - 主要验证页面流程、页面展示、弹窗交互、按钮行为
      - 依赖真实页面操作与可视化结果
      - 适合用 UI 自动化脚本沉淀
      - 同一验证点需要同时覆盖接口结果与页面呈现时，可与 AI-API用例 同时存在
    not_apply_when:
      - 主要验证纯接口行为
      - 主要验证后端数据校验

  测试必测:
    meaning: 测试角色必须纳入人工或重点回归范围的执行责任标签
    apply_when:
      - 风险较高
      - 结果不能仅依赖自动化或开发自测替代
      - 属于测试回归必覆盖范围
      - 属于核心流程或关键变更
    not_apply_when:
      - 仅适合作为开发快速自检
      - 价值较低且无需人工测试重点关注
      - 可被 AI-API / AI-UI 稳定覆盖且不是核心流程或关键变更

  开发必测:
    meaning: 开发在提测前或联调阶段必须自行验证的执行责任标签
    apply_when:
      - 改动影响范围直接且明确
      - 可由开发低成本快速验证
      - 有助于减少明显低级问题流入测试阶段
      - 接口规则、数据源过滤/排序、指标计算、状态流转、保存前后端校验
      - 低成本可自测的配置落库规则
      - 属于核心流程或关键变更
    not_apply_when:
      - 强依赖测试环境联动
      - 需要测试视角做完整业务校验
      - 可被 AI-API / AI-UI 稳定覆盖且无需开发人工兜底

  评审用例:
    meaning: 需要投入产品、开发、测试进行人工评审确认的用例
    apply_when:
      - 规则复杂或存在歧义
      - 需要多角色共同确认预期
      - 涉及关键流程、关键边界、关键业务判断
      - 容易因理解偏差导致产出不一致
    not_apply_when:
      - 规则清晰、执行方式明确、无明显争议
      - 常规低风险校验项

recommended_combinations:
  - tags: ["AI-API用例"]
    scenario: 可由接口或数据断言稳定覆盖，且非核心流程 / 非关键变更
  - tags: ["AI-UI用例"]
    scenario: 可由 UI 自动化稳定覆盖，且非核心流程 / 非关键变更
  - tags: ["AI-API用例", "开发必测"]
    scenario: 数据源过滤/排序、指标计算、接口规则、配置落库等开发可低成本自测项
  - tags: ["AI-API用例", "AI-UI用例", "开发必测"]
    scenario: 保存前后端校验、配置落库后需要同时覆盖接口结果与页面状态
  - tags: ["核心链路", "黄金用例", "AI-UI用例", "开发必测", "测试必测"]
    scenario: 关键主流程、上线决策关键样例
  - tags: ["核心链路", "AI-API用例", "AI-UI用例", "开发必测", "测试必测"]
    scenario: 同时涉及后端状态和前端结果的关键链路

governance_rules:
  - 新增标签必须先修改本规则文件，不能在产出阶段自由生成
  - 若某信息能由编号或字段承接，则不得重复放入标签
  - 若某标签长期低频且无实际筛选价值，应考虑移除
  - 标签维护以稳定、少量、可筛选为原则
